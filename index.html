<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>香港身份证预约配额看板</title>
<meta name="description" content="香港入境处智能身份证预约配额实时监控：5分钟级检测六大办事处放号情况（第三方工具，非官方）">
<style>
:root {
  --bg: #fcfcfb; --card: #ffffff; --ink: #1c1c1a; --ink-2: #5f5e5a; --ink-3: #92918c;
  --line: #e7e6e2; --accent: #0b57d0;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --good-bg: rgba(12,163,12,.13); --warn-bg: rgba(250,178,25,.18); --crit-bg: rgba(208,59,59,.07);
  --good-ink: #006300; --warn-ink: #6b4a00; --crit-ink: #a04545;
}
:root[data-theme="dark"] {
  --bg: #1a1a19; --card: #232322; --ink: #eceae6; --ink-2: #a6a49e; --ink-3: #6f6e69;
  --line: #373633; --accent: #8ab4f8;
  --good-bg: rgba(12,163,12,.22); --warn-bg: rgba(250,178,25,.20); --crit-bg: rgba(208,59,59,.13);
  --good-ink: #6fd66f; --warn-ink: #fac95e; --crit-ink: #e08a8a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 12px 12px calc(28px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 8px; padding: 6px 2px 2px; }
header h1 { font-size: 19px; margin: 0; flex: 1; letter-spacing: .01em; }
#themeBtn {
  border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
  border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer;
}
.fresh { font-size: 12px; color: var(--ink-3); padding: 2px 2px 10px; }
.fresh b { color: var(--ink-2); font-weight: 600; }
.stale { color: var(--crit-ink); font-weight: 600; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 9px 10px 8px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.card.off { opacity: .38; }
.card .nm { font-size: 13px; font-weight: 600; }
.card .st { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.card .st.has { color: var(--good-ink); font-weight: 600; }

.ctrl { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.legend { margin-left: auto; display: flex; gap: 8px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { font-style: normal; padding: 0 5px; border-radius: 4px; font-size: 11px; }

table { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; }
col.dcol { width: 64px; }
thead th {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  font-size: 11px; color: var(--ink-2); font-weight: 600; padding: 6px 0 5px;
  white-space: nowrap; overflow: hidden;
}
td.d {
  font-size: 11px; color: var(--ink-2); white-space: nowrap; padding-right: 2px;
  font-variant-numeric: tabular-nums; overflow: hidden;
}
td.d .wd { color: var(--ink-3); margin-left: 3px; }
td.d.we, td.d.we .wd { color: var(--warn-ink); }
td.q { text-align: center; font-size: 12px; border-radius: 6px; padding: 5px 0; min-width: 34px; }
td.g { background: var(--good-bg); color: var(--good-ink); font-weight: 700; }
td.y { background: var(--warn-bg); color: var(--warn-ink); font-weight: 700; }
td.r { background: var(--crit-bg); color: var(--crit-ink); }
td.x { color: var(--ink-3); }
tr.mo td.m { padding: 14px 0 4px; font-size: 13px; font-weight: 700; color: var(--ink); }

.empty { text-align: center; color: var(--ink-3); padding: 40px 0; font-size: 14px; }
.actions { display: flex; gap: 8px; margin: 14px 0 4px; }
.btn {
  flex: 1; text-align: center; text-decoration: none; border-radius: 10px; padding: 10px 0;
  font-size: 14px; font-weight: 600; border: 1px solid var(--line);
}
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.plain { color: var(--ink-2); background: var(--card); }
#subArea { margin-top: 10px; }
.subCard {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; text-align: center;
}
.subCard p { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.subBtns { display: flex; gap: 8px; }
.subHint { font-size: 11px; color: var(--ink-3); margin-top: 8px; }
footer { margin-top: 18px; font-size: 12px; color: var(--ink-3); line-height: 1.7; }
footer a { color: var(--ink-2); }
#err { display: none; background: var(--crit-bg); color: var(--crit-ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px; }
.banner {
  display: block; text-decoration: none; border-radius: 10px; padding: 10px 12px;
  font-size: 13px; font-weight: 600; margin-bottom: 10px; line-height: 1.5;
}
.banner.urgent { background: var(--crit); color: #fff; }
.banner.notice { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn); }
.banner small { display: block; font-weight: 400; opacity: .85; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>香港身份证预约配额看板</h1>
    <button id="themeBtn" aria-label="切换深浅主题">主题</button>
  </header>
  <div class="fresh" id="fresh">加载中…</div>
  <div id="err"></div>
  <div id="banner"></div>

  <div class="cards" id="cards" aria-label="各办事处最早可约摘要"></div>

  <div class="ctrl">
    <label class="toggle"><input type="checkbox" id="onlyOpen">只看有名额</label>
    <div class="legend">
      <i style="background:var(--good-bg);color:var(--good-ink)">有</i>
      <i style="background:var(--warn-bg);color:var(--warn-ink)">少</i>
      <i style="background:var(--crit-bg);color:var(--crit-ink)">满</i>
      <span>「+」延长时段也有</span>
    </div>
  </div>

  <table id="tbl" aria-label="配额矩阵：行=日期，列=办事处">
    <colgroup id="cg"></colgroup>
    <thead><tr id="thr"></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">当前筛选下没有可约名额，订阅通知蹲守放号 ↓</div>

  <div class="actions">
    <a class="btn primary" target="_blank" rel="noopener"
       href="https://system.es2.immd.gov.hk/smartics2-client/ropbooking/zh-CN/eservices/makeAppointment/step1">去官方预约</a>
    <a class="btn plain" id="ghLink" target="_blank" rel="noopener" href="">GitHub</a>
  </div>
  <div id="subArea"><!-- Phase 5: 订阅入口 --></div>

  <footer>
    第三方公益工具，数据来自入境处公开配额查询接口，每约 5 分钟检测一次，请以
    <a href="https://www.immd.gov.hk/hks/services/hkid/registration_appointment_booking.html" target="_blank" rel="noopener">入境处官网</a>
    为准。仅供学习交流，请勿用于商业用途。反黄牛：本工具只做监控提醒，不做任何代抢代约。
  </footer>
</div>

<script>
"use strict";
/* fork 自部署零改码：从 <user>.github.io/<repo>/ 或 jsDelivr /gh/<user>/<repo>@ 自动推导仓库名 */
var REPO = (function () {
  var m = location.hostname.match(/^([^.]+)\.github\.io$/);
  var seg = location.pathname.split("/")[1];
  if (m && seg) return m[1] + "/" + seg;
  var j = location.pathname.match(/^\/gh\/([^/]+)\/([^/@]+)/);
  if (j) return j[1] + "/" + j[2];
  return "chen1111-a/hkid-quota-monitor";
})();
var SUBSCRIBE_EMAIL = "";   // 订阅收件邮箱（配置后订阅区自动出现）
var FEISHU_GROUP_URL = "";  // 飞书群分享链接（配置后按钮自动出现）
var OFFICE_SHORT = { FTO: "火炭", RHK: "港岛", RKO: "九龙", RTK: "将军澳", TMO: "屯门", YLO: "元朗" };
var OFFICE_ORDER = ["RHK", "RKO", "RTK", "FTO", "TMO", "YLO"];
var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
var DATA_URLS = [
  "data/quota.json",
  "https://cdn.jsdelivr.net/gh/" + REPO + "@main/data/quota.json"
];
var state = { data: null, meta: null, cfg: null, hideOffice: {}, onlyOpen: false };

document.getElementById("ghLink").href = "https://github.com/" + REPO;

/* ---------- 主题 ---------- */
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
var savedTheme = null;
try { savedTheme = localStorage.getItem("theme"); } catch (e) {}
if (savedTheme) applyTheme(savedTheme);
else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) applyTheme("dark");
document.getElementById("themeBtn").onclick = function () {
  var cur = document.documentElement.getAttribute("data-theme") === "dark" ? null : "dark";
  applyTheme(cur);
  try { localStorage.setItem("theme", cur || "light"); } catch (e) {}
};

/* ---------- 数据 ---------- */
function fetchData(i) {
  i = i || 0;
  if (i >= DATA_URLS.length) { showErr("数据加载失败，请稍后刷新重试"); return; }
  var bust = "?t=" + Math.floor(Date.now() / 60000);
  fetch(DATA_URLS[i] + bust, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      state.data = d;
      // meta（新鲜度）与 config（分级提醒阈值）拉不到都不影响主渲染
      var aux = function (path) {
        return fetch(DATA_URLS[i].replace("data/quota.json", path) + bust,
                     { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      };
      return Promise.all([aux("data/meta.json"), aux("config.json")])
        .then(function (res) { state.meta = res[0]; state.cfg = res[1]; render(); });
    })
    .catch(function () { fetchData(i + 1); });
}
function showErr(msg) {
  var el = document.getElementById("err");
  el.textContent = msg; el.style.display = "block";
}

/* 单元格综合状态：一般时段优先，延长时段有名额时加“+” */
function cellOf(q, off, date) {
  var c = (q[off] || {})[date];
  if (!c) return null;
  var best = c.R;
  if (best !== "g" && (c.K === "g" || (c.K === "y" && best !== "g"))) best = c.K === "g" ? "g" : "y";
  return { best: best, plusK: c.K === "g" || c.K === "y" };
}

/* ---------- 渲染 ---------- */
function render() {
  var d = state.data;
  if (!d) return;
  document.getElementById("err").style.display = "none";

  var offices = OFFICE_ORDER.filter(function (o) { return d.quota[o]; });
  d.offices.forEach(function (o) { if (offices.indexOf(o.id) < 0) offices.push(o.id); });

  /* 新鲜度 */
  var meta = state.meta || {};
  var lastIso = meta.last_check || d.fetched_at;
  var last = lastIso ? new Date(lastIso) : null;
  var ageMin = last ? Math.round((Date.now() - last.getTime()) / 60000) : null;
  var freshEl = document.getElementById("fresh");
  freshEl.innerHTML = "官方数据 <b>" + (meta.source_update_time || d.source_update_time || "?") + "</b>（港时）· 本站检查 " +
    (ageMin === null ? "?" : ageMin <= 0 ? "刚刚" : ageMin + " 分钟前") +
    (ageMin !== null && ageMin > 30 ? ' <span class="stale">⚠ 数据可能滞后</span>' : "");

  /* 分级提醒横幅：紧急/提醒窗口内有名额时显性提示 */
  var bannerEl = document.getElementById("banner");
  bannerEl.innerHTML = "";
  var isIso = function (v) { return typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v); };
  var cfg = {};
  if (state.cfg) {
    if (isIso(state.cfg.urgent_before)) cfg.urgent_before = state.cfg.urgent_before;
    if (isIso(state.cfg.notice_before)) cfg.notice_before = state.cfg.notice_before;
    if (cfg.urgent_before && cfg.notice_before && cfg.urgent_before > cfg.notice_before) {
      var tmp = cfg.urgent_before; cfg.urgent_before = cfg.notice_before; cfg.notice_before = tmp;
    }
  }
  if (cfg.urgent_before || cfg.notice_before) {
    var urgentHits = [], noticeHits = [];
    d.dates.forEach(function (date) {
      offices.forEach(function (off) {
        var c = cellOf(d.quota, off, date);
        if (!c || (c.best !== "g" && c.best !== "y")) return;
        var label = (OFFICE_SHORT[off] || off) + " " + date.slice(5).replace("-", "/");
        if (cfg.urgent_before && date < cfg.urgent_before) urgentHits.push(label);
        else if (cfg.notice_before && date < cfg.notice_before) noticeHits.push(label);
      });
    });
    var mk = function (cls, text, sub) {
      var a = document.createElement("a");
      a.className = "banner " + cls;
      a.href = "https://system.es2.immd.gov.hk/smartics2-client/ropbooking/zh-CN/eservices/makeAppointment/step1";
      a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = text + "<small>" + sub + "</small>";
      bannerEl.appendChild(a);
    };
    if (urgentHits.length) {
      mk("urgent", "🚨 " + cfg.urgent_before.slice(5).replace("-", "/") + " 前有名额！" +
        urgentHits.slice(0, 4).join("、") + (urgentHits.length > 4 ? " 等 " + urgentHits.length + " 个" : ""),
        "点此直达官方预约，手慢无");
    } else if (noticeHits.length) {
      mk("notice", "🔔 " + cfg.notice_before.slice(5).replace("-", "/") + " 前有名额：" +
        noticeHits.slice(0, 4).join("、") + (noticeHits.length > 4 ? " 等 " + noticeHits.length + " 个" : ""),
        "点此直达官方预约");
    }
  }

  /* 摘要卡 */
  var cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = "";
  offices.forEach(function (off) {
    var first = null, n = 0;
    d.dates.forEach(function (date) {
      var c = cellOf(d.quota, off, date);
      if (c && (c.best === "g" || c.best === "y")) { n++; if (!first) first = date; }
    });
    var el = document.createElement("div");
    el.className = "card" + (state.hideOffice[off] ? " off" : "");
    el.setAttribute("role", "button");
    el.innerHTML = '<div class="nm">' + (OFFICE_SHORT[off] || off) + "</div>" +
      '<div class="st' + (n ? " has" : "") + '">' +
      (n ? "最早 " + first.slice(5).replace("-", "/") + " · " + n + " 天有" : "全部已满") + "</div>";
    el.onclick = function () {
      state.hideOffice[off] = !state.hideOffice[off];
      render();
    };
    cardsEl.appendChild(el);
  });

  /* 矩阵 */
  var shown = offices.filter(function (o) { return !state.hideOffice[o]; });
  var thr = document.getElementById("thr");
  thr.innerHTML = "<th></th>" + shown.map(function (o) {
    return "<th>" + (OFFICE_SHORT[o] || o) + "</th>";
  }).join("");
  document.getElementById("cg").innerHTML =
    '<col class="dcol">' + shown.map(function () { return "<col>"; }).join("");

  var tb = document.getElementById("tb");
  var rows = [], lastMonth = "", shownRows = 0;
  d.dates.forEach(function (date) {
    var cells = shown.map(function (o) { return cellOf(d.quota, o, date); });
    var hasOpen = cells.some(function (c) { return c && (c.best === "g" || c.best === "y"); });
    if (state.onlyOpen && !hasOpen) return;

    var mo = date.slice(0, 7);
    if (mo !== lastMonth) {
      lastMonth = mo;
      rows.push('<tr class="mo"><td class="m" colspan="' + (shown.length + 1) + '">' +
        parseInt(mo.slice(5), 10) + " 月</td></tr>");
    }
    var dt = new Date(date + "T00:00:00+08:00");
    var wd = dt.getDay();
    var tds = cells.map(function (c) {
      if (!c || c.best === "x") return '<td class="q x">—</td>';
      var ch = c.best === "g" ? "有" : c.best === "y" ? "少" : "满";
      return '<td class="q ' + c.best + '">' + ch + (c.plusK ? "+" : "") + "</td>";
    });
    rows.push('<tr><td class="d' + (wd === 0 || wd === 6 ? " we" : "") + '">' +
      date.slice(5).replace("-", "/") + '<span class="wd">周' + WEEKDAYS[wd] + "</span></td>" +
      tds.join("") + "</tr>");
    shownRows++;
  });
  tb.innerHTML = rows.join("");
  document.getElementById("empty").style.display = shownRows ? "none" : "block";
  document.getElementById("tbl").style.display = shownRows ? "" : "none";
}

document.getElementById("onlyOpen").onchange = function () {
  state.onlyOpen = this.checked; render();
};

/* ---------- 订阅区（内地直连：发邮件即订阅，无需科学上网） ---------- */
(function () {
  if (!SUBSCRIBE_EMAIL && !FEISHU_GROUP_URL) return;
  var btns = [];
  if (SUBSCRIBE_EMAIL) {
    btns.push('<a class="btn primary" style="flex:1" href="mailto:' + SUBSCRIBE_EMAIL +
      "?subject=" + encodeURIComponent("订阅香港ID放号提醒") +
      "&body=" + encodeURIComponent("发送此邮件即完成订阅，无需修改内容。") +
      '">📮 邮件订阅放号提醒</a>');
  }
  if (FEISHU_GROUP_URL) {
    btns.push('<a class="btn plain" style="flex:1" target="_blank" rel="noopener" href="' +
      FEISHU_GROUP_URL + '">加入飞书通知群</a>');
  }
  document.getElementById("subArea").innerHTML =
    '<div class="subCard"><p>放号往往几分钟内被抢完——订阅后第一时间提醒你</p>' +
    '<div class="subBtns">' + btns.join("") + "</div>" +
    (SUBSCRIBE_EMAIL ? '<div class="subHint">点按钮发送一封邮件即完成订阅（全程国内网络直连），约 5 分钟内收到确认邮件</div>' : "") +
    "</div>";
})();

/* 每 5 分钟自动刷新；切回前台也刷新 */
fetchData();
setInterval(fetchData, 5 * 60 * 1000);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) fetchData();
});
</script>
</body>
</html>
