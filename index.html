<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>香港身份证预约配额看板</title>
<meta name="description" content="香港入境处智能身份证预约配额实时监控：2分钟级检测六大办事处放号情况（第三方工具，非官方）">
<style>
:root {
  --bg: #fcfcfb; --card: #ffffff; --ink: #1c1c1a; --ink-2: #5f5e5a; --ink-3: #92918c;
  --line: #e7e6e2; --accent: #0b57d0;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --good-bg: rgba(12,163,12,.13); --warn-bg: rgba(250,178,25,.18); --crit-bg: rgba(208,59,59,.07);
  --good-ink: #006300; --warn-ink: #6b4a00; --crit-ink: #a04545;
}
:root[data-theme="dark"] {
  --bg: #1a1a19; --card: #232322; --ink: #eceae6; --ink-2: #a6a49e; --ink-3: #6f6e69;
  --line: #373633; --accent: #8ab4f8;
  --good-bg: rgba(12,163,12,.22); --warn-bg: rgba(250,178,25,.20); --crit-bg: rgba(208,59,59,.13);
  --good-ink: #6fd66f; --warn-ink: #fac95e; --crit-ink: #e08a8a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 12px 12px calc(28px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 8px; padding: 6px 2px 2px; }
header h1 { font-size: 19px; margin: 0; flex: 1; letter-spacing: .01em; }
#themeBtn {
  border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
  border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer;
}
.fresh { font-size: 12px; color: var(--ink-3); padding: 2px 2px 10px; }
.fresh b { color: var(--ink-2); font-weight: 600; }
.stale { color: var(--crit-ink); font-weight: 600; }

/* 调度自证：直读 GitHub Actions 公开审计记录 */
#proof { display: none; }
.proof {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px;
  border: 1px solid var(--line); border-left: 3px solid var(--accent);
  background: var(--card); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px;
  font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
}
.proof .ticks { letter-spacing: 2px; font-weight: 700; }
.proof .ok { color: var(--good-ink); } .proof .bad { color: var(--crit-ink); }
.proof a { color: var(--accent); text-decoration: none; margin-left: auto; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.card {
  min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 9px 10px 8px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .05);
  transition: transform .2s cubic-bezier(.4, 0, .2, 1), box-shadow .2s cubic-bezier(.4, 0, .2, 1), opacity .2s;
}
.card:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0, 0, 0, .05), 0 8px 22px rgba(0, 0, 0, .08); }
.card:active { transform: scale(.97); }
:root[data-theme="dark"] .card { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 4px 14px rgba(0, 0, 0, .28); }
.card.off { opacity: .38; }
.card .nm { font-size: 13px; font-weight: 600; }
.card .st { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.card .st.has { color: var(--good-ink); font-weight: 600; }

.ctrl { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.legend { margin-left: auto; display: flex; gap: 8px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { font-style: normal; padding: 0 5px; border-radius: 4px; font-size: 11px; }

table { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; }
col.dcol { width: 64px; }
thead th {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  font-size: 11px; color: var(--ink-2); font-weight: 600; padding: 6px 0 5px;
  white-space: nowrap; overflow: hidden;
}
td.d {
  font-size: 11px; color: var(--ink-2); white-space: nowrap; padding-right: 2px;
  font-variant-numeric: tabular-nums; overflow: hidden;
}
td.d .wd { color: var(--ink-3); margin-left: 3px; }
td.d.we, td.d.we .wd { color: var(--warn-ink); }
td.q { text-align: center; font-size: 12px; border-radius: 6px; padding: 5px 0; min-width: 34px; }
td.g { background: var(--good-bg); color: var(--good-ink); font-weight: 700; }
td.y { background: var(--warn-bg); color: var(--warn-ink); font-weight: 700; }
td.r { background: var(--crit-bg); color: var(--crit-ink); }
td.x { color: var(--ink-3); }
tr.out td, tr.out td.q { opacity: .34; }
tr.out td.d { color: var(--ink-3); }
.mline { border-top: 1px dashed var(--line); }
.mline td { padding: 10px 0 2px; font-size: 11px; color: var(--ink-3); text-align: center; }
tr.mo td.m { padding: 14px 0 4px; font-size: 13px; font-weight: 700; color: var(--ink); }

.empty { text-align: center; color: var(--ink-3); padding: 40px 0; font-size: 14px; }
.actions { display: flex; gap: 8px; margin: 14px 0 4px; }
.btn {
  flex: 1; text-align: center; text-decoration: none; border-radius: 10px; padding: 10px 0;
  font-size: 14px; font-weight: 600; border: 1px solid var(--line);
  transition: transform .2s cubic-bezier(.4, 0, .2, 1), box-shadow .2s cubic-bezier(.4, 0, .2, 1), border-color .2s;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(11, 87, 208, .25); }
.btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(11, 87, 208, .35); }
.btn.plain { color: var(--ink-2); background: var(--card); }
.btn.plain:hover { border-color: var(--accent); color: var(--ink); }
#subArea { margin-top: 10px; }
.subCard {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; text-align: center;
}
.subCard p { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.subBtns { display: flex; gap: 8px; }
.subHint { font-size: 11px; color: var(--ink-3); margin-top: 8px; }
footer { margin-top: 18px; font-size: 12px; color: var(--ink-3); line-height: 1.7; }
footer a { color: var(--ink-2); }
#err { display: none; background: var(--crit-bg); color: var(--crit-ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px; }
.banner {
  display: block; text-decoration: none; border-radius: 10px; padding: 10px 12px;
  font-size: 13px; font-weight: 600; margin-bottom: 10px; line-height: 1.5;
}
.banner.urgent { background: var(--crit); color: #fff; }
.banner.notice { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn); }
.banner small { display: block; font-weight: 400; opacity: .85; }

/* ---------- DIY 订阅面板（滚轮选日期） ---------- */
#diyMask {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: rgba(0, 0, 0, .45); align-items: flex-end; justify-content: center;
}
#diyMask.on { display: flex; }
.sheet {
  width: 100%; max-width: 420px; background: var(--card); color: var(--ink);
  border-radius: 16px 16px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
  max-height: 92vh; overflow-y: auto;
  animation: rise .22s cubic-bezier(.32, .72, 0, 1);
}
@keyframes rise { from { transform: translateY(14px); opacity: .6; } }
@media (min-width: 560px) {
  #diyMask { align-items: center; }
  .sheet { border-radius: 16px; }
}
.sheetTop { display: flex; align-items: center; margin-bottom: 12px; }
.sheetTop b { flex: 1; font-size: 16px; }
.sheetTop button {
  border: none; background: none; font-size: 14px; cursor: pointer; padding: 4px 2px;
  color: var(--ink-3);
}
.sheetTop button.go { color: var(--accent); font-weight: 700; }
.fieldLab { font-size: 12px; color: var(--ink-3); margin: 12px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink-2);
  border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: background .15s, color .15s, border-color .15s;
}
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.seg { display: flex; gap: 6px; }
.seg button {
  flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--ink-2);
  border-radius: 9px; padding: 8px 0; font-size: 13px; cursor: pointer;
}
.seg button.on { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
.wheels { position: relative; display: flex; gap: 8px; height: 180px; margin-top: 4px; }
.wheel {
  flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; text-align: center;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none;
  overscroll-behavior: contain;
}
.wheel::-webkit-scrollbar { display: none; }
.wheel .it {
  height: 36px; line-height: 36px; scroll-snap-align: center;
  font-size: 15px; color: var(--ink-3); font-variant-numeric: tabular-nums;
  transition: color .12s, font-size .12s;
}
.wheel .it.sel { color: var(--ink); font-weight: 700; font-size: 18px; }
.wheel .pad { height: 72px; }
.wheelBar {
  position: absolute; left: 0; right: 0; top: 72px; height: 36px; pointer-events: none;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: rgba(11, 87, 208, .06); border-radius: 6px;
}
:root[data-theme="dark"] .wheelBar { background: rgba(138, 180, 248, .10); }
.sheetPreview {
  margin-top: 12px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 10px; font-size: 12px; color: var(--ink-2); line-height: 1.6;
}
.sheetPreview b { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>香港身份证预约配额看板</h1>
    <button id="themeBtn" aria-label="切换深浅主题">主题</button>
  </header>
  <div class="fresh" id="fresh">加载中…</div>
  <div id="proof" class="proof"></div>
  <div id="err" role="alert" aria-live="assertive"></div>
  <div id="banner"></div>

  <div class="cards" id="cards" aria-label="各办事处最早可约摘要"></div>

  <div class="ctrl">
    <label class="toggle"><input type="checkbox" id="onlyOpen">只看有名额</label>
    <div class="legend">
      <i style="background:var(--good-bg);color:var(--good-ink)">有</i>
      <i style="background:var(--warn-bg);color:var(--warn-ink)">少</i>
      <i style="background:var(--crit-bg);color:var(--crit-ink)">满</i>
      <span>「+」延长时段也有</span>
    </div>
  </div>

  <table id="tbl" aria-label="配额矩阵：行=日期，列=办事处">
    <colgroup id="cg"></colgroup>
    <thead><tr id="thr"></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">当前筛选下没有可约名额，订阅通知蹲守放号 ↓</div>

  <div class="actions">
    <a class="btn primary" target="_blank" rel="noopener"
       href="https://www.gov.hk/tc/residents/immigration/idcard/hkic/bookregidcard.htm">去官方预约/改期</a>
    <a class="btn plain" id="ghLink" target="_blank" rel="noopener" href="">GitHub</a>
  </div>
  <div id="subArea"><!-- Phase 5: 订阅入口 --></div>
  <div id="diyMask"><!-- DIY 订阅面板，openDiy() 首次打开时填充 --></div>

  <footer>
    第三方公益工具，数据来自入境处公开配额查询接口，每约 2 分钟检测一次，请以
    <a href="https://www.gov.hk/tc/residents/immigration/idcard/hkic/bookregidcard.htm" target="_blank" rel="noopener">入境处官网</a>
    为准。仅供学习交流，请勿用于商业用途。反黄牛：本工具只做监控提醒，不做任何代抢代约。
  </footer>
</div>

<script>
"use strict";
/* fork 自部署零改码：从 <user>.github.io/<repo>/ 或 jsDelivr /gh/<user>/<repo>@ 自动推导仓库名 */
var REPO = (function () {
  var m = location.hostname.match(/^([^.]+)\.github\.io$/);
  var seg = location.pathname.split("/")[1];
  if (m && seg) return m[1] + "/" + seg;
  var j = location.pathname.match(/^\/gh\/([^/]+)\/([^/@]+)/);
  if (j) return j[1] + "/" + j[2];
  return "chen1111-a/hkid-quota-monitor";
})();
/* 订阅入口只在本仓库生效：fork 出去后自动置空，避免把 fork 用户的订阅信
   和群成员导给原作者。自部署者把 OWNER_REPO 改成自己的仓库并填这两项即可。 */
var OWNER_REPO = "chen1111-a/hkid-quota-monitor";
var SUBSCRIBE_EMAIL = REPO === OWNER_REPO ? "2037445294@qq.com" : "";
var FEISHU_GROUP_URL = REPO === OWNER_REPO
  /* 链接里的 & 写成 &amp;：这串会直接拼进 innerHTML 的 href，裸 & 属于
     HTML 的歧义实体引用，浏览器目前当字面量处理但不保证一直如此。
     注意本串已是 HTML 转义态，勿再过 esc()，否则 &amp;amp; 会断链 */
  ? "https://applink.feishu.cn/client/chat/chatter/add_by_link?link_token=925r5d77-9e8a-402d-a6ce-f93d9f90a4f8&amp;share_token=56041516-e26d-43f0-ac73-c500f1d730d8" : "";  // 飞书群分享链接（配置后按钮自动出现）
/* 用官方预约系统显示的地区名（接口 district 字段），与官网对得上 */
var OFFICE_SHORT = { RHK: "湾仔", RKO: "长沙湾", RTK: "将军澳", FTO: "火炭", TMO: "屯门", YLO: "元朗" };
var OFFICE_ORDER = ["RHK", "RKO", "RTK", "FTO", "TMO", "YLO"];
var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
var DATA_URLS = [
  "data/quota.json",
  "https://cdn.jsdelivr.net/gh/" + REPO + "@main/data/quota.json"
];
/* 上游 API 字段会经 data/quota.json 流到每个访问者的浏览器，
   一律转义后再进 innerHTML（存储型 XSS 防线） */
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
var state = { data: null, meta: null, cfg: null, hideOffice: {}, onlyOpen: false };

document.getElementById("ghLink").href = "https://github.com/" + REPO;

/* ---------- 主题 ---------- */
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
var savedTheme = null;
try { savedTheme = localStorage.getItem("theme"); } catch (e) {}
if (savedTheme) applyTheme(savedTheme);
else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) applyTheme("dark");
document.getElementById("themeBtn").onclick = function () {
  var cur = document.documentElement.getAttribute("data-theme") === "dark" ? null : "dark";
  applyTheme(cur);
  try { localStorage.setItem("theme", cur || "light"); } catch (e) {}
};

/* ---------- 数据 ---------- */
function fetchData(i) {
  i = i || 0;
  if (i >= DATA_URLS.length) { showErr("数据加载失败，请稍后刷新重试"); return; }
  var bust = "?t=" + Math.floor(Date.now() / 30000);  // 30s 桶，跟上 2 分钟数据节奏
  fetch(DATA_URLS[i] + bust, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      state.data = d;
      // meta（新鲜度）与 config（分级提醒阈值）拉不到都不影响主渲染
      var aux = function (path) {
        return fetch(DATA_URLS[i].replace("data/quota.json", path) + bust,
                     { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      };
      return Promise.all([aux("data/meta.json"), aux("config.json")])
        .then(function (res) {
          state.meta = res[0]; state.cfg = res[1];
          // 渲染异常必须与网络失败区分开：否则用户被引导去做无用的刷新，
          // 而且会白白多切换一次数据源
          try { render(); } catch (err) {
            showErr("页面渲染异常，请刷新重试（数据已取到）");
            if (window.console) console.error(err);
          }
        });
    })
    .catch(function () { fetchData(i + 1); });
}
function showErr(msg) {
  var el = document.getElementById("err");
  el.textContent = msg; el.style.display = "block";
}

/* 单元格综合状态：一般时段优先，延长时段有名额时加“+” */
function cellOf(q, off, date) {
  var c = (q[off] || {})[date];
  if (!c) return null;
  var best = c.R;
  if (best !== "g" && (c.K === "g" || (c.K === "y" && best !== "g"))) best = c.K === "g" ? "g" : "y";
  return { best: best, plusK: c.K === "g" || c.K === "y" };
}

/* ---------- 渲染 ---------- */
function render() {
  var d = state.data;
  if (!d) return;
  document.getElementById("err").style.display = "none";

  var offices = OFFICE_ORDER.filter(function (o) { return d.quota[o]; });
  d.offices.forEach(function (o) { if (offices.indexOf(o.id) < 0) offices.push(o.id); });

  /* 新鲜度 */
  var meta = state.meta || {};
  var lastIso = meta.last_check || d.fetched_at;
  var last = lastIso ? new Date(lastIso) : null;
  var ageMin = last ? Math.round((Date.now() - last.getTime()) / 60000) : null;
  var freshEl = document.getElementById("fresh");
  var srcRaw = meta.source_update_time || d.source_update_time || "";
  var srcAge = null;
  var m = /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2}):(\d{2})$/.exec(srcRaw);
  if (m) {
    // 官方时间戳是港时（UTC+8），换算成绝对时刻后再和本机时间比
    var srcMs = Date.parse(m[3] + "-" + m[1] + "-" + m[2] + "T" +
                           m[4] + ":" + m[5] + ":" + m[6] + "+08:00");
    if (!isNaN(srcMs)) srcAge = Math.round((Date.now() - srcMs) / 60000);
  }
  var rel = function (n) { return n === null ? "?" : n <= 0 ? "刚刚" : n + " 分钟前"; };
  freshEl.innerHTML = "官方数据 <b>" + esc(srcRaw || "?") + "</b>（港时，" + rel(srcAge) +
    "）· 本站检查 " + rel(ageMin) +
    (srcAge !== null && srcAge > 20
      ? ' <span class="stale">⚠ 官方数据本身较旧，与官网可能有出入</span>'
      : ageMin !== null && ageMin > 30
      ? ' <span class="stale">⚠ 本站检查滞后</span>' : "");

  /* 分级提醒横幅：紧急/提醒窗口内有名额时显性提示 */
  var bannerEl = document.getElementById("banner");
  bannerEl.innerHTML = "";
  var isIso = function (v) { return typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v); };
  var cfg = {};
  if (state.cfg) {
    if (isIso(state.cfg.urgent_before)) cfg.urgent_before = state.cfg.urgent_before;
    if (isIso(state.cfg.notice_before)) cfg.notice_before = state.cfg.notice_before;
    if (isIso(state.cfg.monitor_before)) cfg.monitor_before = state.cfg.monitor_before;
    if (cfg.urgent_before && cfg.notice_before && cfg.urgent_before > cfg.notice_before) {
      var tmp = cfg.urgent_before; cfg.urgent_before = cfg.notice_before; cfg.notice_before = tmp;
    }
  }
  if (cfg.urgent_before || cfg.notice_before) {
    var urgentHits = [], noticeHits = [];
    d.dates.forEach(function (date) {
      offices.forEach(function (off) {
        var c = cellOf(d.quota, off, date);
        if (!c || (c.best !== "g" && c.best !== "y")) return;
        if (cfg.monitor_before && date >= cfg.monitor_before) return;  // 窗口外不提醒
        var label = esc(OFFICE_SHORT[off] || off) + " " + esc(date.slice(5).replace("-", "/"));
        if (cfg.urgent_before && date < cfg.urgent_before) urgentHits.push(label);
        else if (cfg.notice_before && date < cfg.notice_before) noticeHits.push(label);
      });
    });
    var mk = function (cls, text, sub) {
      var a = document.createElement("a");
      a.className = "banner " + cls;
      a.href = "https://www.gov.hk/tc/residents/immigration/idcard/hkic/bookregidcard.htm";
      a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = text + "<small>" + sub + "</small>";
      bannerEl.appendChild(a);
    };
    if (urgentHits.length) {
      mk("urgent", "🚨 " + cfg.urgent_before.slice(5).replace("-", "/") + " 前有名额！" +
        urgentHits.slice(0, 4).join("、") + (urgentHits.length > 4 ? " 等 " + urgentHits.length + " 个" : ""),
        "点此直达官方预约，手慢无");
    } else if (noticeHits.length) {
      mk("notice", "🔔 " + cfg.notice_before.slice(5).replace("-", "/") + " 前有名额：" +
        noticeHits.slice(0, 4).join("、") + (noticeHits.length > 4 ? " 等 " + noticeHits.length + " 个" : ""),
        "点此直达官方预约");
    }
  }

  /* 摘要卡 */
  var cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = "";
  offices.forEach(function (off) {
    var first = null, n = 0;
    d.dates.forEach(function (date) {
      var c = cellOf(d.quota, off, date);
      if (c && (c.best === "g" || c.best === "y")) { n++; if (!first) first = date; }
    });
    var el = document.createElement("div");
    el.className = "card" + (state.hideOffice[off] ? " off" : "");
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.setAttribute("aria-pressed", state.hideOffice[off] ? "false" : "true");
    el.onkeydown = function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); el.onclick(); }
    };
    el.innerHTML = '<div class="nm">' + esc(OFFICE_SHORT[off] || off) + "</div>" +
      '<div class="st' + (n ? " has" : "") + '">' +
      (n ? "最早 " + first.slice(5).replace("-", "/") + " · " + n + " 天有" : "全部已满") + "</div>";
    el.onclick = function () {
      state.hideOffice[off] = !state.hideOffice[off];
      render();
    };
    cardsEl.appendChild(el);
  });

  /* 矩阵 */
  var shown = offices.filter(function (o) { return !state.hideOffice[o]; });
  var thr = document.getElementById("thr");
  thr.innerHTML = "<th></th>" + shown.map(function (o) {
    return "<th>" + esc(OFFICE_SHORT[o] || o) + "</th>";
  }).join("");
  document.getElementById("cg").innerHTML =
    '<col class="dcol">' + shown.map(function () { return "<col>"; }).join("");

  var tb = document.getElementById("tb");
  var rows = [], lastMonth = "", shownRows = 0, markedOut = false;
  d.dates.forEach(function (date) {
    var cells = shown.map(function (o) { return cellOf(d.quota, o, date); });
    var hasOpen = cells.some(function (c) { return c && (c.best === "g" || c.best === "y"); });
    if (state.onlyOpen && !hasOpen) return;

    var mo = date.slice(0, 7);
    if (mo !== lastMonth) {
      lastMonth = mo;
      rows.push('<tr class="mo"><td class="m" colspan="' + (shown.length + 1) + '">' +
        parseInt(mo.slice(5), 10) + " 月</td></tr>");
    }
    // 用 UTC 取值，否则 UTC+8 以西的用户看到的星期整体错一天
    var wd = new Date(date + "T00:00:00Z").getUTCDay();
    var tds = cells.map(function (c) {
      if (!c || c.best === "x") return '<td class="q x">—</td>';
      var ch = c.best === "g" ? "有" : c.best === "y" ? "少" : "满";
      return '<td class="q ' + c.best + '">' + ch + (c.plusK ? "+" : "") + "</td>";
    });
    var outOfScope = cfg.monitor_before && date >= cfg.monitor_before;
    if (outOfScope && !markedOut) {
      markedOut = true;
      rows.push('<tr class="mline"><td colspan="' + (shown.length + 1) + '">' +
        "以下日期在监测范围外（" + esc(cfg.monitor_before) + " 起），不推送提醒</td></tr>");
    }
    rows.push('<tr' + (outOfScope ? ' class="out"' : "") + '><td class="d' + (wd === 0 || wd === 6 ? " we" : "") + '">' +
      date.slice(5).replace("-", "/") + '<span class="wd">周' + WEEKDAYS[wd] + "</span></td>" +
      tds.join("") + "</tr>");
    shownRows++;
  });
  tb.innerHTML = rows.join("");
  var emptyEl = document.getElementById("empty");
  if (!shown.length) {
    emptyEl.textContent = "已隐藏全部办事处，点上方卡片恢复显示";
  } else if (!shownRows) {
    emptyEl.textContent = state.onlyOpen
      ? "当前筛选下没有可约名额，订阅通知蹲守放号 ↓"
      : "暂无数据，请稍后刷新";
  }
  var blank = !shown.length || !shownRows;
  emptyEl.style.display = blank ? "block" : "none";
  document.getElementById("tbl").style.display = blank ? "none" : "";
}

document.getElementById("onlyOpen").onchange = function () {

};

/* ---------- DIY 面板：办事处多选 + 年月日滚轮 ----------
   为什么不用 <input type="date">：安卓各家浏览器的原生日期控件差异极大，
   部分国产内核干脆弹不出来；而这个入口是订阅的最后一步，弹不出来 = 掉订阅。
   自绘滚轮用 scroll-snap 实现，滑动惯性交给浏览器，无依赖。 */
var DIY_OFFICES = ["湾仔", "长沙湾", "将军澳", "火炭", "屯门", "元朗"];
var IT_H = 36;                 /* 与 .wheel .it 的 height 必须一致 */
var diyState = { mode: "on", y: 0, m: 0, d: 0, offices: {} };

function daysIn(y, m) { return new Date(y, m, 0).getDate(); }
function pad2(n) { return (n < 10 ? "0" : "") + n; }

function buildWheel(el, items, sel, onPick) {
  el.innerHTML = '<div class="pad"></div>' +
    items.map(function (v) { return '<div class="it">' + esc(String(v)) + "</div>"; }).join("") +
    '<div class="pad"></div>';
  var its = el.querySelectorAll(".it");
  function mark(i) {
    for (var k = 0; k < its.length; k++) its[k].className = "it" + (k === i ? " sel" : "");
  }
  var idx = Math.max(0, items.indexOf(sel));
  mark(idx);
  el.scrollTop = idx * IT_H;
  /* 定时器挂在元素上：年/月联动重建日轮时必须掐掉旧轮的 pending 防抖，
     否则旧 timer 会拿旧 items 回写状态，绕过月末夹取造出 2026-02-31 */
  clearTimeout(el._t);
  /* 确定按钮要同步现算，不等防抖（见 wheelValue） */
  el._items = items;
  el.onscroll = function () {
    clearTimeout(el._t);
    el._t = setTimeout(function () {
      /* 面板切页会整块替换 DOM，pending 回调若照跑，脱离文档的元素
         scrollTop 恒为 0，会把用户刚选的日期改写成第 1 行 */
      if (!el.isConnected) return;
      var i = Math.round(el.scrollTop / IT_H);
      i = Math.min(items.length - 1, Math.max(0, i));
      mark(i);
      onPick(items[i]);
    }, 90);
  };
  /* 点哪一行就滚到哪一行——桌面端用鼠标滚轮对齐很别扭。
     必须瞬时对齐 + 同步落状态，不能用 smooth：平滑动画要几百毫秒，
     点完立刻按确定时 syncDiyFromWheels 会读到动画中途的 scrollTop，
     把刚点的日期覆盖成中间值（真浏览器 E2E 抓到过） */
  el.onclick = function (e) {
    var row = e.target.closest(".it");
    if (!row) return;
    var i = Array.prototype.indexOf.call(its, row);
    mark(i);
    onPick(items[i]);
    el.scrollTop = i * IT_H;
  };
}

function wheelValue(id) {
  /* 从滚轮当前 scrollTop 同步现算选中值。「滚完/点完立刻按确定」时防抖
     还没落盘（点击对齐的平滑动画 + 90ms，窗口足有半秒），diyState 是旧值；
     on 语义严格，锁错一天 = 目标日零通知，所以确定那一刻必须现算 */
  var el = document.getElementById(id);
  var i = Math.round(el.scrollTop / IT_H);
  i = Math.min(el._items.length - 1, Math.max(0, i));
  return el._items[i];
}

function syncDiyFromWheels() {
  diyState.y = wheelValue("wY");
  diyState.m = wheelValue("wM");
  diyState.d = wheelValue("wD");
  var max = daysIn(diyState.y, diyState.m);
  if (diyState.d > max) diyState.d = max;
}

function renderDayWheel() {
  var max = daysIn(diyState.y, diyState.m);
  if (diyState.d > max) diyState.d = max;      /* 1/31 切到 2 月要夹回来 */
  var days = [];
  for (var i = 1; i <= max; i++) days.push(i);
  buildWheel(document.getElementById("wD"), days, diyState.d, function (v) {
    diyState.d = v; renderDiyPreview();
  });
}

function diyDate() {
  return diyState.y + "-" + pad2(diyState.m) + "-" + pad2(diyState.d);
}

function diyPickedOffices() {
  return DIY_OFFICES.filter(function (o) { return diyState.offices[o]; });
}

function renderDiyPreview() {
  var offs = diyPickedOffices();
  var all = offs.length === DIY_OFFICES.length || offs.length === 0;
  var when = diyState.mode === "on"
    ? "只有 <b>" + esc(diyDate()) + "</b> 这一天放号才通知你"
    : "只要是 <b>" + esc(diyDate()) + "</b> 之前的名额就通知你";
  var warn = "";
  /* 监测窗口在个性化过滤之前全局生效：锁定窗口外的日期=永远不会有通知。
     滚轮又允许选到任何一天，不在这里拦一句，「就这一天才通知」会静默
     变成「永远不通知」——功能承诺的直接反面 */
  var mb = state.cfg && state.cfg.monitor_before;
  if (mb && diyState.mode === "on" && diyDate() >= mb) {
    warn = '<br><span style="color:var(--crit-ink)">⚠️ 本站只监测 ' + esc(mb) +
      " 之前的名额，选这一天不会收到任何通知</span>";
  }
  var box = document.getElementById("diyPreview");
  /* 进入第二步后选择页 DOM 已被替换，pending 的滚轮防抖回调仍会触发到这里 */
  if (box) box.innerHTML =
    "订阅后：" + (all ? "全部办事处" : "只看 <b>" + esc(offs.join("、")) + "</b>") +
    "，" + when + "。" + warn;
}

function diyBody() {
  var offs = diyPickedOffices();
  var body = "订阅香港ID放号提醒（个性化）。\n";
  if (offs.length && offs.length < DIY_OFFICES.length) {
    body += "只看办事处：" + offs.join(" ") + "\n";
  }
  body += diyState.mode === "on"
    ? "就这一天放号才通知：" + diyDate() + "\n"
    : "只要这天之前的名额：" + diyDate() + "\n";
  body += "（这封信直接发出即可，不用改）";
  return body;
}

function diyMailto() {
  return "mailto:" + SUBSCRIBE_EMAIL + "?subject=" +
    encodeURIComponent("订阅香港ID放号提醒") + "&body=" + encodeURIComponent(diyBody());

function copyBtn(id, getText) {
  /* 复制按钮：clipboard API 失败（老内核/被策略禁）退回 textarea 方案，
     再失败按钮直接显示失败——绝不能默默装作复制成功 */
  var b = document.getElementById(id);
  if (!b) return;
  b.addEventListener("click", function () {
    var t = getText();
    function ok() { b.textContent = "✓ 已复制"; setTimeout(function () { b.textContent = b.dataset.lab; }, 1600); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = t; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      var done = false;
      try { done = document.execCommand("copy"); } catch (e) { /* noop */ }
      document.body.removeChild(ta);
      if (done) ok(); else b.textContent = "复制失败，请长按选择";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(ok, fallback);
    } else fallback();
  });
}

function showDiyStep2() {
  /* 确定后不直接跳 mailto：一部分用户的默认邮件程序没配好（点了没反应，
     或跳进一个空白写信页要手填收件人），直接跳走=流程断在最后一步还没提示。
     这一屏把「打开邮件 App」和「手动复制去任意邮箱」两条路都摆出来 */
  var sheet = document.querySelector("#diyMask .sheet");
  sheet.innerHTML =
    '<div class="sheetTop"><b>最后一步：发出这封邮件</b>' +
    '<button type="button" id="diyBack">返回修改</button></div>' +
    '<div class="sheetPreview" id="diyStep2Sum"></div>' +
    /* href 拼进 innerHTML，& 按本文件惯例写成 &amp;（属性值会解码回来） */
    '<div style="margin-top:12px"><a class="btn primary" style="display:block" id="diyMailBtn" href="' +
    diyMailto().replace(/&/g, "&amp;") + '">📮 打开邮件 App，直接点发送</a></div>' +
    '<div class="fieldLab">邮件 App 打不开 / 没反应？手动发也一样：</div>' +
    '<div class="sheetPreview">① 复制收件人和内容　② 打开你常用的邮箱（QQ/网易/任意）' +
    '　③ 粘贴到新邮件里发出<br><br>收件人：<b>' + esc(SUBSCRIBE_EMAIL) + "</b>" +
    '<br>内容：<span id="diyBodyEcho" style="white-space:pre-line"></span></div>' +
    '<div class="seg" style="margin-top:10px">' +
    '<button type="button" id="cpAddr" data-lab="复制收件人">复制收件人</button>' +
    '<button type="button" id="cpBody" data-lab="复制内容">复制内容</button></div>' +
    '<div class="subHint" style="margin-top:10px">发出后约 2 分钟收到确认邮件，回显你的订阅范围</div>';
  document.getElementById("diyStep2Sum").innerHTML = describeDiy();
  document.getElementById("diyBodyEcho").textContent = diyBody();
  document.getElementById("diyBack").addEventListener("click", function () {
    document.getElementById("diyMask").dataset.built = "";
    openDiy();
  });
  copyBtn("cpAddr", function () { return SUBSCRIBE_EMAIL; });
  copyBtn("cpBody", function () { return diyBody(); });
  /* 步骤页替换掉了选择页的 DOM，下次打开需要重建 */
  document.getElementById("diyMask").dataset.built = "";
}

function describeDiy() {
  var offs = diyPickedOffices();
  var all = offs.length === DIY_OFFICES.length || offs.length === 0;
  return "订阅范围：" + (all ? "全部办事处" : "只看 <b>" + esc(offs.join("、")) + "</b>") +
    "，" + (diyState.mode === "on"
      ? "只有 <b>" + esc(diyDate()) + "</b> 这一天放号才通知"
      : "<b>" + esc(diyDate()) + "</b> 之前的名额都通知") + "。";
}

function closeDiy() {
  document.getElementById("diyMask").classList.remove("on");
  document.removeEventListener("keydown", diyEsc);
}
function diyEsc(e) { if (e.key === "Escape") closeDiy(); }

function openDiy() {
  var mask = document.getElementById("diyMask");
  var firstOpen = !mask.dataset.built;
  if (firstOpen) {
    mask.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="个性化订阅">' +
      '<div class="sheetTop"><b>个性化订阅</b>' +
      '<button type="button" id="diyCancel">取消</button>' +
      '<button type="button" class="go" id="diyOk" style="margin-left:14px">确定</button></div>' +
      '<div class="fieldLab">只看哪些办事处（不选 = 全部）</div>' +
      '<div class="chips" id="diyChips"></div>' +
      '<div class="fieldLab">日期怎么算</div>' +
      '<div class="seg"><button type="button" data-mode="on">就这一天</button>' +
      '<button type="button" data-mode="before">这天及之前</button></div>' +
      '<div class="fieldLab">滑动选择日期</div>' +
      '<div class="wheels"><div class="wheelBar"></div>' +
      '<div class="wheel" id="wY"></div><div class="wheel" id="wM"></div>' +
      '<div class="wheel" id="wD"></div></div>' +
      '<div class="sheetPreview" id="diyPreview"></div></div>';
    mask.dataset.built = "1";

    mask.addEventListener("click", function (e) { if (e.target === mask) closeDiy(); });
    document.getElementById("diyCancel").addEventListener("click", closeDiy);
    document.getElementById("diyOk").addEventListener("click", function () {
      syncDiyFromWheels();   // 防抖可能还没落盘，确定那一刻以滚轮实际位置为准
      showDiyStep2();
    });
    document.querySelectorAll(".seg button").forEach(function (b) {
      b.addEventListener("click", function () {
        diyState.mode = b.dataset.mode;
        document.querySelectorAll(".seg button").forEach(function (x) {
          x.className = x.dataset.mode === diyState.mode ? "on" : "";
        });
        renderDiyPreview();
      });
    });

    var chips = document.getElementById("diyChips");
    /* 选中态从 diyState 恢复：从第二步「返回修改」会重建这块 DOM，
       不恢复的话视觉全灰、状态却记着选择，再点一下实际是反向取消 */
    chips.innerHTML = DIY_OFFICES.map(function (o) {
      return '<span class="chip' + (diyState.offices[o] ? " on" : "") +
        '" data-o="' + esc(o) + '">' + esc(o) + "</span>";
    }).join("");
    chips.addEventListener("click", function (e) {
      var c = e.target.closest(".chip");
      if (!c) return;
      var o = c.dataset.o;
      diyState.offices[o] = !diyState.offices[o];
      c.className = "chip" + (diyState.offices[o] ? " on" : "");
      renderDiyPreview();
    });
  }

  /* 默认停在「最早那个还有名额的日期」——用户开面板多半就是冲它来的。
     数据没加载出来时退回今天，绝不能因为这个便利功能把面板卡住。
     只在首次打开播种：误关重开时办事处/模式都保留，唯独日期被重播会
     显得像 bug（用户刚滚到的那天没了）。播种标记独立于 DOM 重建标记：
     从第二步「返回修改」会重建 DOM（firstOpen 为真），但日期必须保留 */
  if (!diyState.seeded) {
    diyState.seeded = true;
    var seed = (function () {
      var d = state.data;
      if (d && d.dates) {
        for (var i = 0; i < d.dates.length; i++) {
          for (var k = 0; k < OFFICE_ORDER.length; k++) {
            /* cellOf 返回 {best, plusK}，不是原始 {R, K}——读错属性条件恒假，
               整个「停在最早有名额日」会静默退化成停在首日（审计抓到过） */
            var c = cellOf(d.quota, OFFICE_ORDER[k], d.dates[i]);
            if (c && (c.best === "g" || c.best === "y")) return d.dates[i];
          }
        }
        if (d.dates.length) return d.dates[0];
      }
      var t = new Date();
      return t.getFullYear() + "-" + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate());
    })();
    var sp = seed.split("-");
    diyState.y = +sp[0]; diyState.m = +sp[1]; diyState.d = +sp[2];
  }

  /* 先显示再建滚轮：display:none 时元素不可滚动，buildWheel 里的
     scrollTop 赋值会被静默丢弃——滚轮视觉停在第 1 行、状态却记着种子日，
     用户第一次滑动后两边就对不上（真浏览器 E2E 抓到过） */
  mask.classList.add("on");
  document.addEventListener("keydown", diyEsc);

  var years = [diyState.y, diyState.y + 1];
  var months = [];
  for (var i = 1; i <= 12; i++) months.push(i);
  buildWheel(document.getElementById("wY"), years, diyState.y, function (v) {
    diyState.y = v; renderDayWheel(); renderDiyPreview();
  });
  buildWheel(document.getElementById("wM"), months, diyState.m, function (v) {
    diyState.m = v; renderDayWheel(); renderDiyPreview();
  });
  renderDayWheel();
  document.querySelectorAll(".seg button").forEach(function (x) {
    x.className = x.dataset.mode === diyState.mode ? "on" : "";
  });
  renderDiyPreview();
}

/* ---------- 调度自证：直读 GitHub Actions 公开审计 API ---------- */
function fetchProof() {
  fetch("https://api.github.com/repos/" + REPO + "/actions/workflows/monitor.yml/runs?per_page=12&status=completed")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      var runs = (j.workflow_runs || []).filter(function (r) { return r.name === "quota-monitor"; });
      if (!runs.length) return;
      var now = Date.now();
      var times = runs.map(function (r) { return new Date(r.created_at).getTime(); });
      var lastHour = times.filter(function (t) { return now - t < 3600e3; }).length;
      var gaps = [];
      for (var k = 0; k + 1 < times.length; k++) gaps.push((times[k] - times[k + 1]) / 60000);
      var avg = gaps.length ? (gaps.reduce(function (a, b) { return a + b; }, 0) / gaps.length) : null;
      var ticks = runs.slice(0, 12).map(function (r) {
        return '<span class="' + (r.conclusion === "success" ? "ok" : "bad") + '">' +
          (r.conclusion === "success" ? "✓" : "✗") + "</span>";
      }).join("");
      var el = document.getElementById("proof");
      var latestAge = Math.round((now - times[0]) / 60000);
      el.innerHTML = "⏱ 最近检测 <b>" + (latestAge <= 0 ? "刚刚" : latestAge + " 分钟前") + "</b>" +
        " · 近 1 小时 <b>" + lastHour + "</b> 次" +
        (avg !== null ? " · 平均间隔 <b>" + avg.toFixed(1) + "</b> 分钟" : "") +
        ' · <span class="ticks">' + ticks + "</span>" +
        '<a href="https://github.com/' + esc(REPO) + '/actions" target="_blank" rel="noopener">完整审计 ↗</a>';
      el.style.display = "flex";
    })
    .catch(function () {
      // 内地网络访问 api.github.com 会失败（也可能撞上 60次/小时 限流）——
      // 最需要这块信任背书的人恰好看不到，至少要说明原因而不是静默消失
      var el = document.getElementById("proof");
      el.innerHTML = "⏱ 调度记录需访问 GitHub，当前网络不可达｜" +
        '<a href="https://github.com/' + esc(REPO) + '/actions" target="_blank" rel="noopener">手动查看 ↗</a>';
      el.style.display = "flex";
    });
}

/* 90 秒自动刷新（数据 2 分钟一更）；切回前台也刷新 */
fetchData();
fetchProof();
setInterval(fetchData, 90 * 1000);          // 数据 2 分钟一更，页面 90 秒重拉
setInterval(fetchProof, 5 * 60 * 1000);     // 自证面板同样要保鲜，否则时间会说谎
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) { fetchData(); fetchProof(); }
});
</script>
