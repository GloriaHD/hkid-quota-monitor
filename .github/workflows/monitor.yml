name: quota-monitor

on:
  repository_dispatch:
    types: [tick]          # cron-job.org 每 5 分钟 POST 触发（见 docs/cron-setup.md）
  workflow_dispatch: {}    # 手动触发
  schedule:
    - cron: "*/15 * * * *" # 兜底：外部定时器失效时仍有 15 分钟级监控

concurrency:
  group: quota-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run quota check
        run: python -m quota_monitor.run

      - name: Process subscriptions (mail-in)
        continue-on-error: true
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: |
          pip install -q cryptography
          python -m quota_monitor.subscribe

      - name: Send notifications
        continue-on-error: true
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: |
          pip install -q cryptography
          python -m quota_monitor.notify

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name "quota-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache (mainland mirror freshness)
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in data/quota.json data/meta.json data/events.json; do
            curl -sS -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}" || true
          done
