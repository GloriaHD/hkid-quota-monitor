name: quota-monitor

on:
  repository_dispatch:
    types: [tick]          # cron-job.org 每 5 分钟 POST 触发（见 docs/cron-setup.md）
  workflow_dispatch: {}    # 手动触发
  schedule:
    - cron: "*/15 * * * *" # 兜底：外部定时器失效时仍有 15 分钟级监控

concurrency:
  group: quota-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # 浅克隆：数据提交历史每天数百条，全量 clone 会越来越慢
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 抓取先跑：不让依赖安装挡在检测前面（fetch/diff 只用标准库）
      - name: Run quota check
        id: run
        run: python -m quota_monitor.run

      - name: Install deps
        run: pip install -q cryptography

      - name: Process subscriptions (mail-in)
        continue-on-error: true
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: python -m quota_monitor.subscribe

      - name: Send notifications
        continue-on-error: true
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: python -m quota_monitor.notify

      - name: Commit data
        id: commit
        run: |
          git config user.name "quota-bot"
          git config user.email "actions@users.noreply.github.com"
          # 配额内容有变/心跳到期 -> 全量 data/；否则只提交订阅名册和
          # 通知冷却状态（若有变化），避免纯时间戳提交灌爆仓库
          if [ "${{ steps.run.outputs.commit }}" = "true" ]; then
            git add data/
          else
            for f in data/subscribers.json.enc data/notify_state.json; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache (mainland mirror freshness)
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in index.html config.json data/quota.json data/meta.json data/events.json; do
            curl -sS -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}" || true
          done
